name: Render Core CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  background-multilayer-installed-consumer:
    name: Background Multilayer Installed Consumer (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            options: ""
          - profile: cropped
            options: >-
              -DJELLYFRAME_ENABLE_CANVAS2D=OFF
              -DJELLYFRAME_ENABLE_MODERN_PAINT=OFF
              -DJELLYFRAME_ENABLE_FLEX_GRID=OFF
              -DJELLYFRAME_ENABLE_ADVANCED_FORMS=OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure ABI4 Core
        run: >-
          cmake -S . -B build/package-${{ matrix.profile }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DJELLYFRAME_BUILD_TESTS=OFF
          -DJELLYFRAME_INSTALL_RENDER_CORE=ON
          -DJELLYFRAME_RENDER_CORE_ENGINE_ABI=4
          ${{ matrix.options }}

      - name: Build and install ABI4 Core
        run: |
          cmake --build build/package-${{ matrix.profile }} --parallel
          cmake --install build/package-${{ matrix.profile }} --prefix "$PWD/build/install-${{ matrix.profile }}"

      - name: Derive expected package identities
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          build = Path("build/package-${{ matrix.profile }}") / "generated"
          manifest = json.loads((build / "jellyframe_render_core_source_manifest.json").read_text())
          profile = json.loads((build / "jellyframe_render_core_profile.json").read_text())
          if profile["engineAbi"] != 4:
              raise SystemExit(f"expected ABI4, got ABI{profile['engineAbi']}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"EXPECTED_CORE_SOURCE_HASH={manifest['sourceHash']}\n")
              env.write(f"EXPECTED_CORE_PROFILE_ID={profile['profileId']}\n")
          PY

      - name: Qualify installed text and shared paragraph contract
        run: |
          cmake -S tests/package/text_system_consumer -B build/text-consumer-${{ matrix.profile }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/install-${{ matrix.profile }}"
          cmake --build build/text-consumer-${{ matrix.profile }} --parallel
          ctest --test-dir build/text-consumer-${{ matrix.profile }} --output-on-failure

      - name: Configure installed consumer
        run: >-
          cmake -S tests/package/background_multilayer_consumer
          -B build/consumer-${{ matrix.profile }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build/install-${{ matrix.profile }}"
          -DEXPECTED_CORE_SOURCE_HASH="$EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_CORE_PROFILE_ID="$EXPECTED_CORE_PROFILE_ID"

      - name: Build and test installed consumer
        run: |
          cmake --build build/consumer-${{ matrix.profile }} --parallel
          ctest --test-dir build/consumer-${{ matrix.profile }} --output-on-failure

      - name: Configure positioned precision installed consumer
        run: >-
          cmake -S tests/package/positioned_precision_consumer
          -B build/positioned-consumer-${{ matrix.profile }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build/install-${{ matrix.profile }}"
          -DEXPECTED_SOURCE_HASH="$EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_PROFILE="$EXPECTED_CORE_PROFILE_ID"

      - name: Build and test positioned precision installed consumer
        run: |
          cmake --build build/positioned-consumer-${{ matrix.profile }} --parallel
          ctest --test-dir build/positioned-consumer-${{ matrix.profile }} --output-on-failure

      - name: Configure C5 mixed dimensions installed consumer
        run: >-
          cmake -S tests/package/c5_flex_grid_consumer
          -B build/c5-bounded-consumer-${{ matrix.profile }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build/install-${{ matrix.profile }}"
          -DEXPECTED_SOURCE_HASH="$EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_PROFILE="$EXPECTED_CORE_PROFILE_ID"

      - name: Build and test C5 mixed dimensions installed consumer
        run: |
          cmake --build build/c5-bounded-consumer-${{ matrix.profile }} --parallel
          ctest --test-dir build/c5-bounded-consumer-${{ matrix.profile }} --output-on-failure

      - name: Configure bounded wrapped-row installed consumer
        run: >-
          cmake -S tests/package/wrapped_row_flex_consumer
          -B build/wrapped-row-consumer-${{ matrix.profile }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build/install-${{ matrix.profile }}"
          -DEXPECTED_SOURCE_HASH="$EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_PROFILE="$EXPECTED_CORE_PROFILE_ID"
          -DCMAKE_CXX_FLAGS=-fno-rtti

      - name: Build and test bounded wrapped-row installed consumer
        run: |
          cmake --build build/wrapped-row-consumer-${{ matrix.profile }} --parallel
          ctest --test-dir build/wrapped-row-consumer-${{ matrix.profile }} --output-on-failure

      - name: Configure R3 completion installed consumer
        run: >-
          cmake -S tests/package/event_dispatch_completion_consumer
          -B build/r3-completion-${{ matrix.profile }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build/install-${{ matrix.profile }}"
          -DEXPECTED_CORE_SOURCE_HASH="$EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_PROFILE_ID="$EXPECTED_CORE_PROFILE_ID"
          -DCMAKE_CXX_FLAGS=-fno-rtti

      - name: Configure R3 failure installed consumer
        run: >-
          cmake -S tests/package/event_dispatch_failure_consumer
          -B build/r3-failure-${{ matrix.profile }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build/install-${{ matrix.profile }}"
          -DEXPECTED_SOURCE_HASH="$EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_PROFILE_ID="$EXPECTED_CORE_PROFILE_ID"
          -DCMAKE_CXX_FLAGS=-fno-rtti

      - name: Configure R3 Submit kind installed consumer
        run: >-
          cmake -S tests/package/submit_event_kind_consumer
          -B build/r3-submit-${{ matrix.profile }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$PWD/build/install-${{ matrix.profile }}"
          -DEXPECTED_SOURCE_HASH="$EXPECTED_CORE_SOURCE_HASH"
          -DEXPECTED_PROFILE_ID="$EXPECTED_CORE_PROFILE_ID"
          -DCMAKE_CXX_FLAGS=-fno-rtti

      - name: Build and test R3 installed consumers without RTTI
        run: |
          for consumer in completion failure submit; do
            cmake --build "build/r3-$consumer-${{ matrix.profile }}" --parallel
            ctest --test-dir "build/r3-$consumer-${{ matrix.profile }}" --output-on-failure
          done

  standalone:
    name: Standalone Build And Archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure
        run: >
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DJELLYFRAME_BUILD_TESTS=ON
          -DJELLYFRAME_INSTALL_RENDER_CORE=ON

      - name: Build
        run: cmake --build build/release --parallel

      - name: Run CTest
        run: ctest --test-dir build/release --output-on-failure

      - name: Install package
        run: cmake --install build/release --prefix build/install

      - name: Verify source archive
        run: >
          python tests/render_core_source_archive_tests.py
          --cmake cmake
          --source-root .
          --generator Ninja

      - name: Create source distribution
        run: python tools/package_render_core_source.py --output-dir build/source-dist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: jellyframe-render-core-source
          path: build/source-dist/
          if-no-files-found: error

  experimental-gid-catalog:
    name: Experimental GID Catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned offline font preparation dependencies
        run: python -m pip install -r tools/font_resource_requirements.txt

      - name: Test experimental GID bitmap catalog
        run: python tests/tools/test_noto_gid_catalog_spike.py
